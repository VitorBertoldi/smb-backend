# Swiss Music Box: a local copy of the data group's Azure database.
# Same schema (mock-db/schema.sql), one day of their data (mock-db/data), see mock-db/README.md.
#
#   docker compose up -d          start it; the first start loads the data (about a minute)
#   docker compose down -v        drop the data (reloaded on the next start)
#
# Connect: localhost:5433, database swisstransport, schema public.
#   backend (read-only): backenduser / dev
#   admin:               postgres / dev
services:
  transport-db:
    image: postgres:18
    environment:
      POSTGRES_DB: swisstransport
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - mock-swisstransport:/var/lib/postgresql
      - ./mock-db:/mock-db:ro
      - ./mock-db/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  mock-swisstransport:
