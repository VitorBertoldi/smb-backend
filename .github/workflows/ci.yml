name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and architecture tests, plus the Spring context test (Testcontainers uses the
      # runner's Docker).
      - run: ./mvnw -B verify
