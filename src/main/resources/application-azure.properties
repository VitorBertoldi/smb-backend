# The data group's database on Azure. Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=azure
# Needs the AZURE_DB_PASSWORD environment variable and a network the Azure firewall allows (USI or VPN).
# Database, user and schema are the same as the local copy in application.properties.
spring.datasource.url=jdbc:postgresql://d101-swisstransport-db.postgres.database.azure.com:5432/swisstransport?sslmode=require
spring.datasource.password=${AZURE_DB_PASSWORD}
