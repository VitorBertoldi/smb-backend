spring.application.name=smb-backend

# The data group's gold database (compose.yaml). The backend only reads it.
spring.datasource.url=jdbc:postgresql://localhost:5433/transport
spring.datasource.username=backend_reader
spring.datasource.password=dev
spring.datasource.hikari.read-only=true

# The schema belongs to the data group: Hibernate checks our entities against it at start-up
# and never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=transport
spring.jpa.open-in-view=false
