spring.application.name=smb-backend

# The data group's gold database. The backend only reads it.
# The defaults point at the local copy (compose.yaml). Anywhere else, set the environment
# variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
# (e.g. jdbc:postgresql://domain-data:5432/transport). The password has no default and never
# goes in this file: for the local copy it is "dev" (export SPRING_DATASOURCE_PASSWORD=dev).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/transport}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:backend_reader}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.read-only=true

# The schema belongs to the data group: Hibernate checks our entities against it at start-up
# and never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=transport
spring.jpa.open-in-view=false

# The station list and the paths are large and repetitive JSON: gzip makes them several times
# smaller. JSON is compressed by default once compression is on (responses over 2 KB).
server.compression.enabled=true

# Websites allowed to call the API from a browser (CORS), comma-separated; patterns such as
# https://*.domain-fe work. The default is the frontend's dev servers. In production set the
# environment variable APP_CORS_ALLOWED_ORIGINS, e.g. APP_CORS_ALLOWED_ORIGINS=https://domain-fe
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
