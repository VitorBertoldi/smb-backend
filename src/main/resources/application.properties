spring.application.name=smb-backend

# The local copy of the data group's database (compose.yaml): same database, schema and user as
# on Azure. For Azure itself run with the azure profile (application-azure.properties).
spring.datasource.url=jdbc:postgresql://localhost:5433/swisstransport
spring.datasource.username=backenduser
spring.datasource.password=dev
spring.datasource.hikari.read-only=true

# The schema belongs to the data group: Hibernate checks our entities against it at start-up
# and never changes it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# The station list and the paths are large and repetitive JSON: gzip makes them several times
# smaller. JSON is compressed by default once compression is on (responses over 2 KB).
server.compression.enabled=true
